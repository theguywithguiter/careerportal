<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jobs | CareerPortal</title>

    <link rel="stylesheet" href="css/jobs.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            CareerPortal
        </div>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="#">Jobs</a></li>

            <li>

<a href="companies.html">

Companies

</a>

</li>

            <li><a href="about.html">About</a></li>

        </ul>

    </nav>

    <!-- Jobs Section -->

    <section class="jobs-page">

        <!-- Sidebar -->

        <aside class="filters">

            <h2>Filters</h2>

            <div class="filter-box">

                <h4>Job Type</h4>

                <label><input type="checkbox" value="Full Time" class="job-filter"> Full Time</label>

                <label><input type="checkbox" value="Part Time" class="job-filter"> Part Time</label>

                <label><input type="checkbox" value="Internship" class="job-filter"> Internship</label>
            </div>

            <div class="filter-box">

                <h4>Experience</h4>

                <label>
            <input type="checkbox" value="Fresher" class="experience-filter">
            Fresher
            </label>

            <label>
            <input type="checkbox" value="1-3 Years" class="experience-filter">
            1-3 Years
            </label>

            <label>
            <input type="checkbox" value="3+ Years" class="experience-filter">
            3+ Years
            </label>

            </div>

            <div class="filter-box">

                <h4>Location</h4>

                <label><input type="checkbox" value="Kolkata" class="location-filter"> Kolkata</label>

                <label><input type="checkbox" value="Bangalore" class="location-filter"> Bangalore</label>

                <label><input type="checkbox" value="Hyderabad" class="location-filter"> Hyderabad</label>
                
                <label><input type="checkbox" value="Others" class="location-filter"> Other cities</label>
            </div>

        </aside>

        <!-- Main -->

        <main class="jobs-content">

            <div class="search-bar">

                <input
                type="text"
                id="searchInput"
                placeholder="Search jobs...">

                <button>

                    Search

                </button>

            </div>

            <div class="jobs-grid">

            </div>

        </main>

    </section>
    <script src="data/jobs.js"></script>
    <script src="js/jobs.js"></script>

</body>

</html>
